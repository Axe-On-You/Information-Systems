services:
  pg:
    image: postgres:15-alpine
    container_name: is_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-studs}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  wildfly:
    image: quay.io/wildfly/wildfly:latest
    container_name: is_wildfly
    ports:
      - "8080:8080"
      - "9990:9990"
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://pg:5432/studs}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./target/study-group-service-1.0-SNAPSHOT.war:/opt/jboss/wildfly/standalone/deployments/ROOT.war
    depends_on:
      - pg
    restart: unless-stopped

volumes:
  pg_data:
